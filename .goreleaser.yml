project_name: zohodesk-cli

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  -
    id: zohodesk-cli
    main: ./main.go
    binary: zohodesk-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildTime={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  -
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^fix:'

brews:
  -
    name: zohodesk-cli
    tap:
      owner: jrodriguezruibal
      name: homebrew-tap
      branch: main
    folder: Formula
    homepage: https://github.com/jrodriguezruibal/zohodesk-cli
    description: CLI for Zoho Desk API
    license: MIT
    test: |
      system "#{bin}/zohodesk-cli", "version"

nfpms:
  -
    id: packages
    builds:
      - zohodesk-cli
    formats:
      - deb
      - rpm
    maintainer: Jose Rodriguez <jrodriguezruibal@gmail.com>
    description: CLI for Zoho Desk API
    license: MIT
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/jrodriguezruibal/zohodesk-cli